[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/app",
    "crates/infra",
    "crates/server",
    "crates/worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Workspace crates
domain = { path = "crates/domain" }
app = { path = "crates/app" }
infra = { path = "crates/infra" }

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
async-trait = "0.1"

# Web
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "timeout"] }

# Data
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros",
] }
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
lapin = "4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "grpc-tonic",
    "trace",
] }
opentelemetry_sdk = "0.33"
tracing-opentelemetry = "0.34"

# Utilities
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
secrecy = { version = "0.10", features = ["serde"] }
dotenvy = "0.15"
config = "0.15"
futures-util = "0.3"

# Testing
testcontainers-modules = { version = "0.15", features = [
    "postgres",
    "redis",
    "rabbitmq",
] }
http-body-util = "0.1"

# Enforced code quality boundaries. `clippy::unwrap_used` keeps `unwrap()` out
# of library code; use `?`, `expect` in binaries, or explicit error handling.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
lto = "thin"
